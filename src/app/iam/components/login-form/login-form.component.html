<div class="welcome-message">
  <h2>{{'login.welcome'| translate}}</h2>
</div>

<form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
  <mat-form-field class="form-field" appearance="outline">
    <mat-label>{{ 'login.email' | translate }}</mat-label>
    <input matInput [(ngModel)]="email" name="email" required #emailInput="ngModel">
    <mat-error *ngIf="emailInput.invalid && emailInput.touched">
      {{ 'login.erequired' | translate }}
    </mat-error>
  </mat-form-field>

  <mat-form-field class="form-field" appearance="outline">
    <mat-label>{{ 'login.password' | translate }}</mat-label>
    <input matInput type="password" [(ngModel)]="password" name="password" required #passwordInput="ngModel">
    <mat-error *ngIf="passwordInput.invalid && passwordInput.touched">
      {{ 'login.prequired' | translate }}
    </mat-error>
  </mat-form-field>

  <div class="button-container">
    <button mat-raised-button color="primary" type="submit" class="submit-button">Login</button>
  </div>
  <div class="create-button">
    {{ 'login.reminder' | translate }}
    <a class="button-register" (click)="goToRegister()">{{ 'login.register' | translate }}</a>
  </div>


  <!-- Error message -->
  <p *ngIf="errorMessage" class="error-message">{{ 'login.error' | translate }}</p>
</form>
