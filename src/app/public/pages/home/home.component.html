<app-toolbar></app-toolbar>
<h1 class="section-name">Properties</h1>
<div class="container">
  <!-- Contenedor para las propiedades del usuario -->
  <div class="property-info-section" *ngFor="let property of userProperties">
    <mat-card class="property-details-card">
      <div class="property-content">
        <img [src]="property.image" alt="Property image" class="property-image">
        <div class="property-details">
          <h2 class="property-type">{{ property.type }}</h2>
          <p><strong>Price:</strong> s/ {{ property.initialPrice }}</p>
          <p><strong>Type of housing:</strong> {{ property.propertyType === 'House' ? 'Casa' : property.propertyType }}</p>
          <p><strong>Address:</strong> {{ property.address }}</p>
          <p><strong>Description:</strong> {{ property.description }}</p>
        </div>
      </div>

      <!-- Botón para redirigir al pago -->
      <div class="property-actions">
        <button mat-raised-button color="primary" (click)="buyProperty(property.Id)">Buy</button>
      </div>
    </mat-card>
  </div>
</div>
